name: Desktop Validation

on:
    push:
        branches:
            - "release/**"
    pull_request:
        branches:
            - develop
    merge_group:
        types:
            - checks_requested

concurrency:
    group: desktop-validation-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Type, static, and unit
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate selective upstream policy
              env:
                  BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
              run: |
                  test -n "$BASE_REF"
                  python3 scripts/upstream/validate_policy.py \
                      --base-ref "$BASE_REF" \
                      --allow-ledger-introduction

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install desktop dependencies
              run: pnpm install --frozen-lockfile --filter seventwos-workspace-desktop

            - name: Type-check desktop source
              run: |
                  pnpm --filter seventwos-workspace-desktop lint:types:src
                  pnpm --filter seventwos-workspace-desktop lint:types:scripts

            - name: Validate workflow and config syntax
              run: |
                  pnpm lint:workflows
                  node <<'NODE'
                  const fs = require("node:fs");

                  const files = [
                      "apps/desktop/package.json",
                      "apps/desktop/project.json",
                      "apps/desktop/seventwos.org/release/build.json",
                      "apps/desktop/seventwos.org/release/config.json",
                      "apps/desktop/seventwos.org/preview/build.json",
                      "apps/desktop/seventwos.org/preview/config.json",
                  ];

                  for (const file of files) {
                      JSON.parse(fs.readFileSync(file, "utf8"));
                      console.log(`Validated ${file}`);
                  }
                  NODE

            - name: Run desktop unit tests
              run: pnpm --filter seventwos-workspace-desktop test:unit --run
