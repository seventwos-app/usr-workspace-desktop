name: Prepare Seventwos Desktop Build

on:
    workflow_call:
        inputs:
            config:
                type: string
                required: true
                description: "Repository-relative config directory under apps/desktop"
            web-bundle-url:
                type: string
                required: true
                description: "Exact HTTPS URL of the explicitly selected upstream web bundle"
            web-bundle-sha256:
                type: string
                required: true
                description: "Expected lowercase or uppercase SHA-256 digest of the web bundle"

permissions:
    contents: read

jobs:
    prepare:
        name: Verify and prepare pinned web bundle
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Validate inputs
              shell: bash
              env:
                  CONFIG: ${{ inputs.config }}
                  WEB_BUNDLE_URL: ${{ inputs.web-bundle-url }}
                  WEB_BUNDLE_SHA256: ${{ inputs.web-bundle-sha256 }}
              run: |
                  set -euo pipefail
                  [[ "$CONFIG" == "seventwos.org/release" || "$CONFIG" == "seventwos.org/preview" ]]
                  [[ "$WEB_BUNDLE_URL" == https://* ]]
                  [[ "$WEB_BUNDLE_SHA256" =~ ^[[:xdigit:]]{64}$ ]]
                  test -f "apps/desktop/$CONFIG/build.json"
                  test -f "apps/desktop/$CONFIG/config.json"
                  python3 scripts/upstream/validate_policy.py \
                      --selection-url "$WEB_BUNDLE_URL" \
                      --selection-sha256 "$WEB_BUNDLE_SHA256"

            - name: Install desktop dependencies
              run: pnpm install --frozen-lockfile --filter seventwos-workspace-desktop

            - name: Download and verify pinned upstream web bundle
              working-directory: apps/desktop
              shell: bash
              env:
                  CONFIG: ${{ inputs.config }}
                  WEB_BUNDLE_URL: ${{ inputs.web-bundle-url }}
                  WEB_BUNDLE_SHA256: ${{ inputs.web-bundle-sha256 }}
              run: |
                  set -euo pipefail
                  curl --fail --location --proto '=https' --tlsv1.2 \
                      --output web-bundle.tar.gz "$WEB_BUNDLE_URL"
                  EXPECTED_SHA256=$(printf '%s' "$WEB_BUNDLE_SHA256" | tr '[:upper:]' '[:lower:]')
                  printf '%s  %s\n' "$EXPECTED_SHA256" web-bundle.tar.gz | sha256sum --check
                  mkdir webapp
                  tar xzf web-bundle.tar.gz -C webapp --strip-components=1
                  cp "$CONFIG/config.json" webapp/config.json
                  pnpm exec asar pack webapp webapp.asar
                  cp "$CONFIG/build.json" variant.json

            - name: Generate native cache inputs
              working-directory: apps/desktop
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm --silent electron --no-sandbox --version > electronVersion
                  jq -c .hakDependencies package.json | sha1sum > hakHash
                  find hak scripts/hak -type f -print0 | sort -z | xargs -0 sha1sum >> hakHash

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: desktop-prepare
                  retention-days: 1
                  if-no-files-found: error
                  path: |
                      apps/desktop/webapp.asar
                      apps/desktop/electronVersion
                      apps/desktop/hakHash
                      apps/desktop/variant.json
