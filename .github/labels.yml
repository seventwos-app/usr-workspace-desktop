# Minimal, repository-owned label set for Seventwos Workspace for Desktop.
#
# This repository packages and ships the desktop (Electron) client; it does
# not contain the full chat feature implementation, so the large Element Web
# feature-area taxonomy previously inherited here has been trimmed down to
# labels that are meaningful for this repository's own issue/PR triage, plus
# labels that are referenced by name from workflows or issue templates in
# this repository.
